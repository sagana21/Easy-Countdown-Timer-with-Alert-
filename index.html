<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styled Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav>
    <h3>⏳ Simple Timer</h3>
  </nav>

  <div class="box">
      <h2>Countdown Timer</h2>

      <input id="secondsInput" type="number" placeholder="Enter seconds">

      <div class="buttons">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
      </div>

      <div class="circle-wrap">
        <svg width="160" height="160">
          <circle class="bg" cx="80" cy="80" r="70" />
          <circle class="progress" cx="80" cy="80" r="70" />
        </svg>
        <span id="display">0</span>
      </div>
     
  </div>

  <audio id="beep" src="https://www.soundjay.com/buttons/beep-07.wav"></audio>

  <script src="script.js"></script>
</body>
</html>
